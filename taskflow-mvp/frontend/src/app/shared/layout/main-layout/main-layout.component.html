<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="Ir al inicio de TaskFlow">
      <span class="brand__mark" aria-hidden="true"><i></i><i></i></span>
      <span><strong>TaskFlow</strong><small>Product workspace</small></span>
      <span class="workspace-switcher" aria-hidden="true">⌄</span>
    </a>
    <nav aria-label="Navegación principal">
      <p class="nav-label">Workspace</p>
      <a routerLink="/dashboard" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-3H4v3Zm10 0h6v-9h-6v9Zm0-16v3h6V4h-6Z" /></svg> Resumen
      </a>
      <a routerLink="/tasks" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 2 2 4-4M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" /></svg> Mis tareas
      </a>
      <a routerLink="/tasks/new" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg> Nueva tarea
      </a>
    </nav>
    <div class="sidebar__footer">
      <span class="footer-icon">?</span><div><p>Centro de ayuda</p><small>Guías y documentación</small></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><span>TaskFlow</span><b>/</b><strong>Resumen</strong></div>
      <div class="topbar-actions">
        <a class="quick-search" routerLink="/tasks" aria-label="Ir a tareas"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Buscar</span><kbd>⌘ K</kbd></a>
        <span class="avatar">TF</span>
        <a class="logout" routerLink="/login" (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg></a>
      </div>
    </header>
    <main><router-outlet /></main>
  </div>
</div>
