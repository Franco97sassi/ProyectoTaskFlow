server:
  port: 8081

spring:
  jackson:
    time-zone: UTC
  application:
    name: taskflow-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/taskflow?stringtype=unspecified}
    username: ${DB_USERNAME:taskflow_user}
    password: ${DB_PASSWORD:taskflow_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  security:
    user:
      name: dev
      password: dev
jwt:
  secret: ${JWT_SECRET:taskflow_secret_key_super_segura_para_desarrollo}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
